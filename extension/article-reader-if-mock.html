<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>altpocket Extension IF Mock</title>
  <style>
    :root {
      --bg-base: #0a0a0a;
      --bg-surface: #141414;
      --bg-elevated: #1e1e1e;
      --text-primary: #e8e8e8;
      --text-secondary: #9aa0a8;
      --text-muted: #6b7078;
      --border-default: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --accent: #d4a574;
      --accent-soft: rgba(212, 165, 116, 0.14);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(1200px 500px at -10% -20%, rgba(212, 165, 116, 0.13), transparent 55%),
        radial-gradient(800px 320px at 130% 120%, rgba(107, 196, 144, 0.08), transparent 50%),
        var(--bg-base);
      color: var(--text-primary);
      font-family: "Inter", "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
      line-height: 1.5;
      padding: 18px;
      min-height: 100vh;
    }

    .shell {
      max-width: 980px;
      margin: 0 auto;
      display: grid;
      gap: 14px;
    }

    .utility-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 2px 2px 0;
      min-height: 20px;
    }

    .utility-left {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .utility-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .utility-link,
    .utility-btn {
      font-size: 11px;
      color: var(--text-muted);
      text-decoration: underline;
      text-underline-offset: 2px;
      text-decoration-color: color-mix(in srgb, var(--text-muted) 55%, transparent);
      opacity: 0.88;
      cursor: pointer;
    }

    .utility-btn {
      border: 0;
      background: transparent;
      padding: 0;
      font: inherit;
    }

    .utility-btn:disabled {
      opacity: 0.45;
      cursor: default;
      text-decoration: none;
    }

    .utility-link:hover,
    .utility-btn:hover {
      color: var(--text-secondary);
      text-decoration-color: color-mix(in srgb, var(--text-secondary) 65%, transparent);
    }

    .utility-status {
      font-size: 11px;
      color: var(--text-secondary);
      min-width: 72px;
      text-align: right;
    }

    .utility-status.is-error {
      color: #d45c5c;
    }

    .utility-status.is-success {
      color: #6bc490;
    }

    .search {
      border: 1px solid var(--border-default);
      background: var(--bg-surface);
      border-radius: 14px;
      padding: 14px;
      display: grid;
      gap: 8px;
    }

    .search-label {
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .search-input {
      width: 100%;
      border-radius: 9px;
      border: 1px solid var(--border-default);
      background: var(--bg-elevated);
      color: var(--text-primary);
      padding: 11px 12px;
      font: inherit;
      outline: none;
    }

    .search-input:focus {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--border-default));
      box-shadow: 0 0 0 2px rgba(212, 165, 116, 0.15);
    }

    .search-hint {
      margin: 0;
      font-size: 12px;
      color: var(--text-muted);
    }

    .workspace {
      display: block;
    }

    .panel {
      border: 1px solid var(--border-default);
      border-radius: 14px;
      background: var(--bg-surface);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .panel-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-default);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .panel-title {
      margin: 0;
      font-size: 13px;
      font-weight: 650;
    }

    .panel-meta {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .panel-list .list {
      max-height: 66vh;
    }

    .list {
      margin: 0;
      padding: 6px;
      list-style: none;
      display: grid;
      gap: 6px;
      overflow: auto;
      min-height: 0;
    }

    .item-card {
      border: 1px solid var(--border-default);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.01);
      padding: 10px;
      display: grid;
      gap: 6px;
    }

    .item-head {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
    }

    .item-title {
      margin: 0;
      font-size: 13px;
      font-weight: 620;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 11px;
    }

    .item-actions {
      display: flex;
      justify-content: flex-end;
    }

    .empty {
      margin: 0;
      padding: 18px 14px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .tag {
      border: 1px solid var(--border-default);
      border-radius: 999px;
      padding: 2px 8px;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.02);
    }

    .show-original {
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      border-radius: 9px;
      padding: 6px 10px;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
    }

    .show-original:hover {
      background: color-mix(in srgb, var(--accent) 14%, transparent);
    }

    @media (max-width: 760px) {
      body {
        padding: 12px;
      }

      .workspace {
        min-height: 0;
      }

      .panel-list .list {
        max-height: 62vh;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="utility-bar" aria-label="utility actions">
      <div class="utility-left">altpocket</div>
      <div class="utility-right">
        <a id="goWebsiteLink" class="utility-link" href="http://localhost:8080/ui/items" target="_blank" rel="noopener noreferrer">Go to website</a>
        <button id="logoutBtn" class="utility-btn" type="button">Log out</button>
        <span id="utilityStatus" class="utility-status" aria-live="polite"></span>
      </div>
    </div>

    <section class="search">
      <label class="search-label" for="searchInput">Search</label>
      <div class="search-row">
        <input id="searchInput" class="search-input" type="text" placeholder="件名・本文・タグで検索（部分一致）" autocomplete="off">
      </div>
      <p class="search-hint">件名・本文・タグを横断検索。Esc でクリア。</p>
    </section>

    <section class="workspace">
      <section class="panel panel-list" aria-label="記事一覧">
        <div class="panel-head">
          <h2 class="panel-title">記事一覧</h2>
          <span id="resultMeta" class="panel-meta">0件</span>
        </div>
        <ul id="itemList" class="list"></ul>
      </section>
    </section>
  </main>

  <script src="article-reader-if-mock.js"></script>
</body>
</html>
