<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="auth.css">
  <title>altpocket sign-in</title>
</head>
<body class="auth-body">
  <main class="auth-shell card">
    <h1>Sign in to altpocket</h1>
    <p class="muted">Complete Google sign-in in this tab, then return to the extension popup.</p>

    <label class="field" for="apiBase">
      <span class="label">API Base URL</span>
      <input id="apiBase" class="input" type="text" placeholder="https://api.example.com">
    </label>

    <div class="auth-actions">
      <button id="startSignIn" class="btn btn-primary" type="button">Start sign in</button>
      <button id="openWebUI" class="btn btn-secondary" type="button">Open Web App</button>
    </div>

    <div id="status" class="status status-info" role="alert" aria-live="polite">Preparing sign-in...</div>
  </main>
  <script src="auth.js"></script>
</body>
</html>
