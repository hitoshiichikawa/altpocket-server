{{define "layout"}}
<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="csrf-token" content="{{.CSRFToken}}">
  <title>{{.Title}}</title>
  <link rel="manifest" href="/manifest.webmanifest?v={{assetVersion}}">
  <link rel="stylesheet" href="/static/theme.css?v={{assetVersion}}">
  <link rel="stylesheet" href="/static/style.css?v={{assetVersion}}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      {{if .User}}
        <a class="brand" href="/ui/items">altpocket</a>
        <nav class="topnav" aria-label="Primary">
          <a href="/ui/items">Items</a>
          <a href="/ui/quick-add">Quick Add</a>
        </nav>
        <div class="account-menu" data-account-menu>
          <button type="button" class="account-menu-trigger" aria-haspopup="menu" aria-expanded="false">
            <span class="account-menu-name">{{if .User.Name}}{{.User.Name}}{{else}}{{.User.Email}}{{end}}</span>
            <span class="account-menu-caret" aria-hidden="true">▾</span>
          </button>
          <div class="account-menu-panel" role="menu">
            <a href="/ui/settings" role="menuitem">Settings</a>
          </div>
        </div>
      {{else}}
        <a class="brand" href="/">altpocket</a>
        <nav class="topnav" aria-label="Primary">
          <a href="/v1/auth/google/login">Sign in</a>
          <a href="/register">Register</a>
        </nav>
      {{end}}
    </div>
  </header>

  <main class="page-container">
    {{template "content" .}}
  </main>

  <script src="/static/app.js?v={{assetVersion}}"></script>
  <script src="/static/pwa.js?v={{assetVersion}}"></script>
</body>
</html>
{{end}}
